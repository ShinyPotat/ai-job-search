# openspec/config.yaml
# Auto-generated by sdd-init — do not edit manually unless you understand the contract.
schema: spec-driven

context: |
  Project: ai-job-search
  Stack: Python 3.12+ (tools, tests), TypeScript/Bun (7 portal CLIs), LaTeX (CVs, cover letters)
  Architecture: Multi-tool job-search workspace with thin-pointer design.
               Candidate profile in CLAUDE.md, workflow specs in .claude/skills/,
               portal CLIs in .agents/skills/. GitHub Actions CI with 6 job matrix.
               Fork-friendly template; forks personalise via /setup.
  Testing: Python unittest (root tests/), Bun test per CLI (tests/ per .agents/skills/*/cli/)
           Custom linter tools/lint_skills.py, security guards tools/security_guards.py
  Style: Python stdlib unittest (no pytest). TypeScript with tsc --noEmit typecheck.
         No formatter detected. LaTeX compiled with lualatex (CV) / xelatex (cover letters).

rules:
  proposal:
    - Include rollback plan for risky changes
    - Evaluate scope against fork-friendly template constraints
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "python -m unittest discover -s tests -t . -v"
  verify:
    test_command: "python -m unittest discover -s tests -t . -v"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner_python: "python -m unittest discover -s tests -t . -v"
  runner_bun: "bun test --timeout 30000"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage: false
  linter: "pip install pyyaml && python tools/lint_skills.py"
  type_checker_bun: "tsc --noEmit"
  type_checker_python: null
  formatter: null
